        .size-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .size-label { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 0.1em; }
        .footer-sim { 
            width: 100%; max-width: 1200px; display: flex; align-items: center;
            justify-content: space-between; padding: 40px;
            border-top: 1px solid #333336;
        }
        .footer-logo-group { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .footer-logo-text { font-size: 2rem; font-weight: 700; color: #F0EFEA; letter-spacing: -0.05em; }
        .footer-links { display: flex; gap: 30px; }
        .footer-links a { color: #9CA3AF; text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; }

    <div class="test-section">
        <h2>The Logo Mark — Large</h2>
        <!--
            Isometric N Logo — Naslogic
            3 prisms: left pillar, right pillar, diagonal connector
            Each prism has 3 visible faces: top (lightest), front-right (brand), left (darkest)
            
            Isometric projection math:
            screenX = cx + (x - y) * cos30 * scale
            screenY = cy + (x + y) * sin30 * scale - z * scale
            
            scale=5, cx=50, cy=88
            cos30=0.866, sin30=0.5
            
            LEFT PILLAR: 3D box (0,0,0) to (1.4,1.2,7.5)
            RIGHT PILLAR: 3D box (4.2,0,0) to (5.6,1.2,7.5)
            DIAGONAL: parallelogram prism connecting top-left to bottom-right
        -->
        <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- LEFT PILLAR -->
            <!-- Left face (x=0) - Darkest -->
            <polygon points="50,18 43.5,21.5 43.5,59 50,55.5" fill="#1B4AAE"/>
            <!-- Front face (y=0) - Brand blue -->
            <polygon points="50,18 56,21 56,58.5 50,55.5" fill="#2563EB"/>
            <!-- Top face - Lightest -->
            <polygon points="50,18 56,21 49.8,24.5 43.5,21.5" fill="#4B8BF5"/>
            
            <!-- RIGHT PILLAR -->
            <!-- Left face (x=0) - Darkest -->
            <polygon points="68.2,28.8 61.7,32.3 61.7,69.8 68.2,66.3" fill="#1B4AAE"/>
            <!-- Front face (y=0) - Brand blue -->
            <polygon points="68.2,28.8 74.2,31.8 74.2,69.3 68.2,66.3" fill="#2563EB"/>
            <!-- Top face - Lightest -->
            <polygon points="68.2,28.8 74.2,31.8 68,35.3 61.7,32.3" fill="#4B8BF5"/>
            
            <!-- DIAGONAL BAR -->
            <!-- Left face - Darkest -->
            <polygon points="50,18 43.5,21.5 61.7,32.3 68.2,28.8" fill="#1B4AAE"/>
            <!-- Front face - Brand blue -->
            <polygon points="50,18 56,21 74.2,31.8 68.2,28.8" fill="#2563EB"/>
            <!-- Bottom face of diagonal (visible) - slightly darker than front -->
            <polygon points="56,21 56,27 74.2,37.8 74.2,31.8" fill="#2050CC"/>
            <polygon points="43.5,21.5 43.5,27.5 61.7,38.3 61.7,32.3" fill="#163D99"/>
        </svg>
    </div>
